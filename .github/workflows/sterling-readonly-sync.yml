name: Sterling read-only integration sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sterling-readonly-sync
  cancel-in-progress: false
jobs:
  observe:
    if: vars.STERLING_READONLY_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-package-lock --ignore-scripts
      - name: Read-only observation
        env:
          STERLING_MOTORS_SERVICE_ACCOUNT_JSON: ${{ secrets.STERLING_MOTORS_SERVICE_ACCOUNT_JSON }}
          STERLING_MUTUAL_SERVICE_ACCOUNT_JSON: ${{ secrets.STERLING_MUTUAL_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:read-only
      - name: Retain sanitized execution summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sterling-sync-summary-${{ github.run_id }}
          path: .sync-status/status.json
          retention-days: 7
